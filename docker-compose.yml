services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: pulerauto-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulerauto
      POSTGRES_PASSWORD: pulerauto
      POSTGRES_DB: pulerauto
    volumes:
      - pulerauto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulerauto -d pulerauto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulerauto_pgdata:
